name: Validate

on:
  pull_request:
  push:
    branches:
      - agent/global-trajectory-language-system

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:language
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  preview-smoke:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 7
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://trajectory-ai-git-feature-voice-pe-1b2bc9-davarntrades-projects.vercel.app
    steps:
      - name: Wait for matching preview deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            root_status=$(curl --silent --show-error --output /tmp/root.html --write-out '%{http_code}' "$PREVIEW_URL/" || true)
            login_status=$(curl --silent --show-error --output /tmp/login.html --write-out '%{http_code}' "$PREVIEW_URL/login" || true)
            health_status=$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' "$PREVIEW_URL/api/diagnostics/provider-health" || true)
            echo "attempt=$attempt root=$root_status login=$login_status provider_health=$health_status"
            if [[ "$root_status" == "200" && "$login_status" == "200" && "$health_status" == "401" ]]; then
              grep -q 'Authentication required' /tmp/health.json
              exit 0
            fi
            sleep 15
          done
          echo 'Root response:'
          head -c 500 /tmp/root.html || true
          echo
          echo 'Login response:'
          head -c 500 /tmp/login.html || true
          echo
          echo 'Provider health response:'
          cat /tmp/health.json || true
          exit 1
